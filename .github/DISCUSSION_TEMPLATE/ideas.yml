title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Use Ideas for early-stage proposals that are not yet ready to become a scoped Issue. Explain the operational problem before proposing the solution.
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, experience or trade-offs
