title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Ask how to interpret or apply TID-CMM. Concrete defects or model changes belong in Issues.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Share environment or assessment context where useful, without confidential information.
